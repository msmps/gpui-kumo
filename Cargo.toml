[workspace]
members = ["crates/gpui-kumo", "apps/gallery"]
default-members = ["apps/gallery"]
exclude = ["vendor/accesskit_atspi_common-0.19.1"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
publish = false

[workspace.dependencies]
gpui-kit = { version = "=0.7.0", default-features = false }
gpui-kumo = { path = "crates/gpui-kumo" }

[workspace.lints.rust]
unsafe_code = "forbid"

# Preserve accessible Input focus tracking without duplicate reverse-Tab stops.
# Exact0.3.7 source plus the documented TabStopMap correction.
[patch.crates-io]
gpui-pre = { path = "vendor/gpui-pre-0.3.7" }

# Preserve Textarea intrinsic growth when policy, width or font changes.
# Exact0.7.0 source plus the documented display-map row reconciliation.
gpui-base = { path = "vendor/gpui-base-0.7.0" }

# Preserve disabled Enabled/Sensitive states on the pinned Linux adapter.
# Exact0.19.1 source plus the documented disabled-state guard.
accesskit_atspi_common = { path = "vendor/accesskit_atspi_common-0.19.1" }
