[package]
name = "gpui-kumo"
description = "A native Kumo design system for GPUI with typed components, themes, and accessibility support."
repository = "https://github.com/msmps/gpui-kumo"
readme = "../../README.md"
license = "MIT"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish = ["crates-io"]

[dependencies]
gpui-kit.workspace = true

[dev-dependencies]
gpui-kit = { workspace = true, default-features = false, features = ["test-support"] }

[lints]
workspace = true

# Document the published Linux dependency graph; avoid unnecessary cross builds.
[package.metadata.docs.rs]
default-target = "x86_64-unknown-linux-gnu"
targets = []
